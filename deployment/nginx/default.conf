# Linux host namespace: only Nginx exposes an application port to the LAN.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Log paths without query strings, cookies, request bodies, or authorization.
log_format solar '$remote_addr $request_method $uri $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout solar;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx is the sole public proxy; discard untrusted incoming forwarding chains.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/ws/energy {
        proxy_pass http://127.0.0.1:8000;
        # proxy_set_header inheritance is all-or-nothing: repeat forwarding here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    # Covers existing 120s LAN scan and 180s device-verification frontend budgets.
    location ^~ /api/v1/setup/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
