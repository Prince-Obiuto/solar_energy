# TLS terminates here. Nginx and FastAPI share the Linux host namespace, so the
# upstream is loopback-only and Uvicorn trusts forwarded headers only from Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Deliberately omit query strings, cookies, headers and bodies from access logs.
log_format solar '$remote_addr $request_method $uri $status $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # This configuration is only deployed with a valid production certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    access_log /dev/stdout solar;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx is the sole public proxy; discard client-supplied forwarding chains.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/ws/energy {
        proxy_pass http://127.0.0.1:8000;
        # proxy_set_header inheritance is all-or-nothing: repeat forwarding here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    # Covers existing 120s LAN scan and 180s device-verification frontend budgets.
    location ^~ /api/v1/setup/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
