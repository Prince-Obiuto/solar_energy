<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B234A"/>
      <stop offset="1" stop-color="#020B1D"/>
    </linearGradient>

    <linearGradient id="sun" x1="26" y1="10" x2="38" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD522"/>
      <stop offset="1" stop-color="#FF9F0A"/>
    </linearGradient>

    <linearGradient id="panel" x1="18" y1="33" x2="45" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19B5FF"/>
      <stop offset="1" stop-color="#1260DB"/>
    </linearGradient>

    <linearGradient id="beam" x1="32" y1="21" x2="27" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC514" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFC514" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="62"
    height="62"
    rx="14"
    fill="url(#bg)"
  />

  <!-- Blue energy arc -->
  <path
    d="M11 44C7 23 18 9 32 9C46 9 57 23 53 44"
    stroke="#16A8F4"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Sun rays -->
  <g
    stroke="#FFB20C"
    stroke-width="2.4"
    stroke-linecap="round"
  >
    <path d="M32 8V11"/>
    <path d="M23.5 11L25.2 13.5"/>
    <path d="M40.5 11L38.8 13.5"/>
    <path d="M18.8 16L21.6 17.2"/>
    <path d="M45.2 16L42.4 17.2"/>
    <path d="M18 23H21"/>
    <path d="M46 23H43"/>
  </g>

  <!-- Sun -->
  <circle
    cx="32"
    cy="19"
    r="7"
    fill="url(#sun)"
  />

  <!-- Sun beam -->
  <path
    d="M27.5 24L36.5 24L42 41H20L27.5 24Z"
    fill="url(#beam)"
  />

  <!-- Building body -->
  <path
    d="M17 42H47V55H17V42Z"
    fill="#F7FAFF"
  />

  <!-- Dark side -->
  <path
    d="M39 40L48 35V55H39V40Z"
    fill="#102B50"
  />

  <!-- Roof -->
  <path
    d="M13 42L21 32H42L51 42"
    stroke="#F8FBFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Solar panel surface -->
  <path
    d="M20.8 33.5H41.4L47 40H15.5L20.8 33.5Z"
    fill="url(#panel)"
  />

  <!-- Solar panel grid -->
  <g
    stroke="#EAF7FF"
    stroke-width="1.3"
    stroke-linecap="round"
  >
    <path d="M27 34L23 40"/>
    <path d="M35 34L32 40"/>
    <path d="M42 34L40 40"/>
    <path d="M18 37H44"/>
  </g>

  <!-- Window -->
  <rect
    x="21"
    y="46"
    width="8"
    height="7"
    rx="1"
    fill="#1677E8"
  />
  <path
    d="M25 46V53M21 49.5H29"
    stroke="#E9F6FF"
    stroke-width="1"
  />

  <!-- Door -->
  <rect
    x="35"
    y="45"
    width="6"
    height="10"
    rx="1"
    fill="#0C8DF1"
  />

  <!-- Ground -->
  <path
    d="M11 56C23 53.5 41 53.5 53 56"
    stroke="#1175EA"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>